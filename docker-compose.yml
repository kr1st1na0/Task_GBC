name: jobs_processing
services:
  redis-storage-service:
    image: redis:7-alpine
    container_name: redis_storage
    ports:
      - "6379:6379"

  api-service:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis-storage-service